name: SwiftWasm
on:
  push:
    branches: ["wasm32-wasi"]
    tags: ["*-wasm32-wasi"]
  pull_request:
    branches: ["wasm32-wasi"]
env:
  SWIFT_VERSION: main-snapshot-2026-09-21
  STACK_SIZE: 4194304
permissions: {}
defaults:
  run:
    shell: bash -euo pipefail {0}
jobs:
  build:
    strategy:
      matrix:
        target:
          - sdk:
              url: https://download.swift.org/development/wasm-sdk/swift-DEVELOPMENT-SNAPSHOT-2026-09-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-09-21-a_wasm.artifactbundle.tar.gz
              checksum: 7a3c451bcaaf06c1ac5856e9215beefed8cba99766b5ce9e170109b0211c27a7
              suffix: _wasm
            artifact-name: swift-format.wasm
            other-wasmopt-flags:
          - sdk:
              url: https://download.swift.org/development/wasm-sdk/swift-DEVELOPMENT-SNAPSHOT-2026-09-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-09-21-a_wasm.artifactbundle.tar.gz
              checksum: 7a3c451bcaaf06c1ac5856e9215beefed8cba99766b5ce9e170109b0211c27a7
              suffix: _wasm-threads
            artifact-name: swift-format-threads.wasm
            other-wasmopt-flags: --enable-threads
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y wabt binaryen
      - run: ./.github/scripts/ci-install-swiftly.sh
      - run: swiftly install -y --use "$SWIFT_VERSION"
      - run: swift --version
      - env:
          SDK_URL: ${{ matrix.target.sdk.url }}
          SDK_CHECKSUM: ${{ matrix.target.sdk.checksum }}
        run: swift sdk install "$SDK_URL" --checksum "$SDK_CHECKSUM"
      - name: Build
        env:
          WASMOPT_FLAGS: ${{ matrix.target.other-wasmopt-flags }}
          ARTIFACT_NAME: ${{ matrix.target.artifact-name }}
          SDK_SUFFIX: ${{ matrix.target.sdk.suffix }}
        run: |
          swift build --product swift-format --swift-sdk "$(swiftc -print-target-info | jq -r '.swiftCompilerTag')$SDK_SUFFIX" -c release -Xlinker -z -Xlinker stack-size="$STACK_SIZE"
          wasm-strip .build/release/swift-format.wasm
          wasm-opt -Oz --enable-bulk-memory --enable-sign-ext --enable-nontrapping-float-to-int $WASMOPT_FLAGS .build/release/swift-format.wasm -o "$ARTIFACT_NAME"
      - name: Upload ${{ matrix.target.artifact-name }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: ${{ matrix.target.artifact-name }}
          path: ${{ matrix.target.artifact-name }}
  test-binary:
    needs: build
    strategy:
      matrix:
        target:
          - artifact-name: swift-format.wasm
            other-wasmkit-flags:
    # TODO: To run a wasp1-threads binary, WasmKit 0.4.0 is required. WasmKit included in the Swift toolchain is still 0.3.1.
    #       - artifact-name: swift-format-threads.wasm
    #         other-wasmkit-flags:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
      - run: ./.github/scripts/ci-install-swiftly.sh
      - run: swiftly install -y --use "$SWIFT_VERSION"
      - name: Download ${{ matrix.target.artifact-name }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: ${{ matrix.target.artifact-name }}
      - env:
          WASMKIT_FLAGS: ${{ matrix.target.other-wasmkit-flags }}
          ARTIFACT_NAME: ${{ matrix.target.artifact-name }}
        run: wasmkit run --dir . $WASMKIT_FLAGS "$ARTIFACT_NAME" --version
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
        with:
          repository: swiftlang/swift
          path: swift
          ref: swift-6.4.0-RELEASE
      - name: Remove unreadable files
        run: rm swift/test/Parse/utf16_bom.swift swift/test/Parse/invalid-utf8.swift
      - env:
          WASMKIT_FLAGS: ${{ matrix.target.other-wasmkit-flags }}
          ARTIFACT_NAME: ${{ matrix.target.artifact-name }}
        run: wasmkit run --dir . --stack-size "$STACK_SIZE" $WASMKIT_FLAGS "$ARTIFACT_NAME" lint -r --ignore-unparsable-files swift/test
  test:
    strategy:
      matrix:
        target:
          - sdk:
              url: https://download.swift.org/development/wasm-sdk/swift-DEVELOPMENT-SNAPSHOT-2026-09-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-09-21-a_wasm.artifactbundle.tar.gz
              checksum: 7a3c451bcaaf06c1ac5856e9215beefed8cba99766b5ce9e170109b0211c27a7
              suffix: _wasm
    # TODO: To run a wasp1-threads binary, WasmKit 0.4.0 is required. WasmKit included in the Swift toolchain is still 0.3.1.
    #       - sdk:
    #           url: https://download.swift.org/development/wasm-sdk/swift-DEVELOPMENT-SNAPSHOT-2026-09-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-09-21-a_wasm.artifactbundle.tar.gz
    #           checksum: 7a3c451bcaaf06c1ac5856e9215beefed8cba99766b5ce9e170109b0211c27a7
    #           suffix: _wasm-threads
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
      - run: ./.github/scripts/ci-install-swiftly.sh
      - run: swiftly install -y --use "$SWIFT_VERSION"
      - run: swift --version
      - env:
          SDK_URL: ${{ matrix.target.sdk.url }}
          SDK_CHECKSUM: ${{ matrix.target.sdk.checksum }}
        run: swift sdk install "$SDK_URL" --checksum "$SDK_CHECKSUM"
      - env:
          SDK_SUFFIX: ${{ matrix.target.sdk.suffix }}
        run: swift test --swift-sdk "$(swiftc -print-target-info | jq -r '.swiftCompilerTag')$SDK_SUFFIX" --toolset wasi-test-toolset.json
  results:
    if: ${{ always() }}
    runs-on: ubuntu-26.04-arm
    needs: [build, test-binary, test]
    steps:
      - run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
